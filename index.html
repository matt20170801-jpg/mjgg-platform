<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MJ GreenGuard — Jobs</title>
<style>
:root{--ink:#16241D;--ink2:#3A4A41;--mute:#7B887F;--line:#DDE1D9;--paper:#F6F7F2;
--panel:#fff;--hi:#C8E019;--pos:#2E6F4E;--neg:#A83A25;}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.shell{max-width:1160px;margin:0 auto;padding:0 13px 90px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:18px 0 13px;border-bottom:2px solid var(--ink)}
.job{font-size:19px;font-weight:700;line-height:1.15}
.sub{font-size:12px;color:var(--mute);margin-top:3px}
.me{margin-left:auto;text-align:right;font-size:12px;color:var(--mute)}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0 16px}
.tab{padding:11px 13px;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;
font-size:14px;font-weight:500;color:var(--mute)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--hi)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-bottom:12px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
border-bottom:1px solid var(--line);flex-wrap:wrap}
.pt{font-size:14px;font-weight:600}.ps{font-size:12px;color:var(--mute)}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:#fff;
border:1px solid var(--line);border-radius:3px;margin-bottom:12px}
.cell{padding:14px 15px;border-right:1px solid var(--line)}.cell:last-child{border-right:0}
.cl{font-size:11px;color:var(--mute)}.cn{font-size:20px;font-weight:600;margin-top:4px}
.cx{font-size:11px;color:var(--mute);margin-top:3px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:11px;color:var(--mute);padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}.r{text-align:right}
.tot td{font-weight:700;background:var(--paper);border-top:2px solid var(--ink)}

.in{width:100%;padding:8px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:14px}
.in:focus{border-color:var(--ink);outline:none}
.qty{width:88px;text-align:right;padding:6px 8px}
.day{width:46px;padding:9px 2px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:15px;font-weight:500}
.day:focus{border-color:var(--ink);outline:none;background:#FCFEEF}
.lab{display:block;font-size:11.5px;color:var(--mute);margin:9px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid var(--ink);
border-radius:3px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--ink)}
.btn.q{background:none;color:var(--ink2);border-color:var(--line);font-weight:500}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}
.x{border:0;background:none;color:var(--mute);padding:5px 7px;font-size:15px}
.x:hover{color:var(--neg)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chip{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:10px;font-size:11px;background:var(--paper)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--ink2)}
.empty{padding:30px;text-align:center;color:var(--mute);font-size:13.5px}
.task{padding:13px 14px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.tname{font-size:14.5px;font-weight:600}.tmeta{font-size:11.5px;color:var(--mute);margin-top:2px}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:9px}
.pbar>i{display:block;height:100%;background:var(--pos)}
.pctrow{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.pctbtn{padding:6px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:12.5px}
.pctbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmt{padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.photos{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.photos img{width:76px;height:76px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(18,28,22,.45);display:flex;align-items:flex-end;
justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:6px 6px 0 0}
@media(min-width:640px){.modal{align-items:center;padding:20px}.sheet{border-radius:4px}}
.pick{display:flex;width:100%;text-align:left;gap:10px;padding:10px 12px;border:0;
border-bottom:1px solid var(--line);background:none}
.pick[disabled]{opacity:.4}
.grid2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.mid{max-width:420px;margin:8vh auto;padding:0 16px}
.err{background:#FDF1EE;border:1px solid #F0C4B8;border-radius:3px;padding:10px 12px;font-size:13px;margin-top:12px}
.foot{font-size:11px;color:var(--mute);text-align:right;padding-top:8px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:5px}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.grow{display:flex;align-items:stretch;border-bottom:1px solid var(--line);min-height:40px}
.grow:last-child{border-bottom:0}
.gleft{position:sticky;left:0;z-index:2;background:#fff;min-width:250px;max-width:250px;

.ghead{background:var(--paper)}.ghead .gleft{background:var(--paper);font-size:11px;color:var(--mute);font-weight:600}
.gtrack{position:relative;flex:1}
.gday{position:absolute;top:0;bottom:0;border-right:1px solid #EFF1EC}
.gday.we{background:#F2F3EE}
.gdlab{font-size:9.5px;color:var(--mute);text-align:center;padding-top:3px}
.gmon{font-size:11px;font-weight:600;padding:3px 6px;position:absolute;white-space:nowrap}
.gbar{position:absolute;top:8px;height:23px;border-radius:3px;display:flex;align-items:center;
padding:0 7px;font-size:11.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--neg);z-index:1}
.gname{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmeta{font-size:10.5px;color:var(--mute)}
.doc{background:#fff;max-width:840px;margin:0 auto;padding:44px 52px;border:1px solid var(--line);
color:#1A1A1A;font-size:11.2pt;line-height:1.55}
.doc h1{font-size:32px;margin:0;letter-spacing:-.02em;font-weight:700}
.doc h2{font-size:12px;margin:26px 0 12px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);
text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.doc p{line-height:1.6;white-space:pre-wrap;margin:0 0 12px}
.doc table{font-size:10.5pt;width:100%}
.doc th{font-size:9pt;letter-spacing:.06em;text-transform:uppercase;color:#555;
border-bottom:1.5px solid var(--ink);padding:7px 8px}
.doc td{padding:8px;border-bottom:1px solid #E6E6E6;vertical-align:top}
.doc tr{page-break-inside:avoid}
.doc .tot td{border-top:1.5px solid var(--ink);border-bottom:0;font-weight:700}
.cover{min-height:300px}
.rule{height:3px;background:var(--ink);margin:26px 0 20px}
.qtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.qmeta{text-align:right;font-size:10.5pt;line-height:1.7;color:#444}
.qmeta b{color:#1A1A1A}
.headline{border:1px solid var(--line);border-left:5px solid var(--brand);padding:20px 24px;margin:30px 0 0}
.headline .n{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.headline .l{font-size:10pt;text-transform:uppercase;letter-spacing:.1em;color:#555}
.terms{font-size:10pt;line-height:1.58;max-width:none}
.terms.two{column-count:2;column-gap:26px;font-size:9pt;line-height:1.5;text-align:justify}
.terms .th{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:9.4pt;
margin:16px 0 6px;break-after:avoid;page-break-after:avoid}
.terms.two .th{font-size:8.6pt;margin:11px 0 4px}
.terms p{margin:0 0 9px}
.terms.two p{margin:0 0 7px}
@media(max-width:700px){.terms{column-count:1}}
.meta{font-size:12.5px;color:var(--ink2);line-height:1.65}
.brk{page-break-before:always}
.specban{border-top:3px solid var(--brand);border-bottom:1px solid #C9CEC5;
padding:14px 0 12px;margin:0 0 20px}
.specban h2{border:0;margin:0;padding:0;font-size:23px;text-transform:none;letter-spacing:-.01em;font-weight:400}
.specbody{font-size:13px;line-height:1.62;white-space:pre-wrap}
.logo{max-width:280px;height:auto;display:block;margin-bottom:10px}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sum.big{font-size:18px;font-weight:700;border-bottom:0;border-top:2px solid var(--ink);padding-top:12px}
@page{size:A4;margin:16mm 15mm 20mm}
@media print{body{background:#fff}.top,nav,.foot,#modal,.noprint{display:none!important}
.shell{padding:0;max-width:none}.doc{border:0;padding:0;max-width:none;font-size:10.4pt}
.runfoot{display:block}}
.runfoot{display:none;position:fixed;bottom:0;left:0;right:0;padding-top:5px;
border-top:.5px solid #C9CEC5;font-size:7.8pt;color:#777;letter-spacing:.04em;
display:none;justify-content:space-between}
@media print{.runfoot{display:flex}}
.cover{display:flex;flex-direction:column;min-height:236mm}
.cover .grow{flex:1}
.covertop{display:flex;justify-content:space-between;align-items:flex-start;gap:30px}
.bigtitle{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:10pt;line-height:1.6}
.kv .k{color:#777}
.party{border-top:1.5px solid var(--ink);padding-top:10px}
.party .h{font-size:8.6pt;text-transform:uppercase;letter-spacing:.14em;color:#666;margin-bottom:7px}
.secbar{color:var(--brand);border-bottom:2.5px solid var(--brand);padding:0 0 6px;
font-size:9.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin:24px 0 0}
.sumbox{max-width:340px;margin-left:auto;break-inside:avoid;page-break-inside:avoid}
.sumwrap{break-inside:avoid;page-break-inside:avoid}
.covfoot{border-top:1.5px solid var(--ink);padding-top:10px;display:flex;
justify-content:space-between;gap:20px;font-size:9pt;color:#555;line-height:1.6}
/* our own cover: a tall photo down one side, the words down the other */
.cv{position:relative;height:252mm;display:flex;page-break-after:always;
margin:-44px -52px 0;overflow:hidden;background:#fff}
.cv .txt{flex:0 0 56%;padding:26mm 16mm 16mm 18mm;display:flex;flex-direction:column}
.cv .shot{flex:1;position:relative;overflow:hidden;border-left:9px solid var(--brand)}
.cv .shot img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block}
.cv .lg{margin-bottom:auto}
.cv .lg img{max-width:210px;max-height:56px}
.cv .ref{font-size:8.8pt;letter-spacing:.22em;text-transform:uppercase;color:var(--brand);
font-weight:700;margin-bottom:14px}
.cv .ti{font-size:30pt;line-height:1.12;font-weight:700;letter-spacing:-.025em;margin:0}
.cv .ad{font-size:13pt;line-height:1.4;color:#4A4A4A;margin-top:14px;font-weight:400}
.cv .brule{width:64px;height:0;border-top:5px solid var(--brand);margin:26px 0 22px}
.cv .kvs{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:10pt;line-height:1.5}
.cv .kvs .k{color:#8A8A8A;text-transform:uppercase;letter-spacing:.1em;font-size:8.4pt;padding-top:2px}
.cv .who{margin-top:auto;padding-top:20px;border-top:1px solid #DDE1D9;font-size:9pt;
color:#666;line-height:1.65}
/* closing page: contact above, photo band below */
.bk{height:252mm;display:flex;flex-direction:column;margin:-44px -52px 0;overflow:hidden;background:#fff}
.bk .top2{padding:26mm 18mm 0}
.bk .top2 img{max-width:210px;max-height:56px;margin-bottom:34px}
.bk .hd{font-size:26pt;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.bk .sub2{font-size:11pt;color:#555;max-width:420px;line-height:1.6}
.bk .cols2{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:32px;font-size:10.5pt;line-height:1.8}
.bk .cols2 .k{font-size:8.4pt;text-transform:uppercase;letter-spacing:.12em;color:#8A8A8A;
display:block;margin-bottom:4px}
.bk .bar{border-top:6px solid var(--brand);margin-top:auto}
.bk .shot{height:88mm;overflow:hidden}
.bk .shot img{width:100%;height:100%;object-fit:cover;object-position:center 58%;display:block}
.intro{font-size:10pt;color:#555;line-height:1.6;margin:0 0 18px;max-width:560px}
.simple td{padding:11px 8px}
.simple .amt{text-align:right;white-space:nowrap;font-weight:600;width:22%}

/* ---------- printable Gantt ---------- */
.gpwrap{background:#fff;color:#1D2420;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  padding:9mm 7mm;border:1px solid var(--line);border-radius:4px;margin-bottom:18px}

const STATUS={"Done":"#2E6F4E","On the go":"#E8A33D","Not started":"#B9C0B6","At risk":"#A83A25"};
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
function money(n,dp){dp=dp||0;const v=n||0;return (v<0?"−$":"$")+Math.abs(v).toLocaleString("en-AU",{minimumFractionDigits:dp,maximumFractionDigits:dp});}
const pctf=n=>((n||0)*100).toFixed(1)+"%";
function isoOf(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
function addDays(s,n){const p=String(s).split("-").map(Number);return isoOf(new Date(p[0],p[1]-1,p[2]+n));}
function fmtDay(s){if(!s)return"";const p=String(s).split("-").map(Number);
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("en-AU",{day:"numeric",month:"short"});}
const fmtWeek=s=>fmtDay(s)+" – "+fmtDay(addDays(s,6));
function longDate(s){ if(!s) return "";
  const p=String(s).split("-").map(Number);
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"}); }
function termsHtml(txt){
  return String(txt||"").split(/\n\s*\n/).map(b=>{
    const line=b.trim(); if(!line) return "";
    const isHead=/^[0-9]+(\.[0-9]+)*\s+[A-Z]/.test(line)||/^[A-Z][A-Z0-9 &'(),.\-]{3,60}$/.test(line);
    if(isHead&&line.length<80) return '<div class="th">'+esc(line)+'</div>';
    const m=line.match(/^([0-9]+\.\s+[A-Z][A-Za-z '&\-]{2,50})\n([\s\S]*)$/);
    if(m) return '<div class="th">'+esc(m[1])+'</div><p>'+esc(m[2])+'</p>';
    return '<p>'+esc(line)+'</p>';
  }).join("");
}
const admin=()=>prof&&(prof.role==="owner"||prof.role==="admin");
const taskEnd=t=>addDays(t.start_date,Math.max(num(t.days),1)-1);
const byId=(arr,id)=>arr.filter(x=>x.id===id)[0];
const claimable=s=>s.kind!=="Variation"||s.variation_status==="Approved";
const cell=(l,n,x,tone)=>'<div class="cell"><div class="cl">'+l+'</div><div class="cn '+(tone||"")+'">'+n+'</div>'+(x?'<div class="cx">'+x+'</div>':"")+'</div>';

/* ---------------- connect ---------------- */
function cfg(){ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch(e){ return null; } }
function setup(msg){
  $("#root").innerHTML='<div class="mid"><div class="job">Connect to your database</div>'+
    '<div class="sub">One time only. Supabase → Project Settings → API.</div>'+
    '<span class="lab">Project URL</span><input class="in" id="cU" placeholder="https://xxxx.supabase.co">'+
    '<span class="lab">anon public key</span><textarea class="in" id="cK" rows="4" placeholder="eyJ..."></textarea>'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<div style="margin-top:14px"><button class="btn" id="cGo">Connect</button></div>'+
    '<div class="ps" style="margin-top:14px">Never paste the service_role key. It ignores every permission rule.</div></div>';
  $("#cGo").onclick=()=>{
    const url=$("#cU").value.trim().replace(/\/$/,""),key=$("#cK").value.trim();
    if(!/^https:\/\/.+\.supabase\.co$/.test(url)) return setup("That does not look like a project URL.");
    if(key.length<40) return setup("That key looks too short.");
    if(key.split(".").length===3){ try{
      const b=JSON.parse(atob(key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      if(b.role==="service_role") return setup("That is the service_role key. Use the anon public key.");
    }catch(e){} }
    localStorage.setItem(CFG_KEY,JSON.stringify({url:url,key:key})); boot();
  };
}
function login(msg){
  $("#root").innerHTML='<div class="mid"><div class="job">MJ GreenGuard</div><div class="sub">Sign in</div>'+
    '<span class="lab">Email</span><input class="in" id="lE" type="email" autocomplete="username">'+
    '<span class="lab">Password</span><input class="in" id="lP" type="password" autocomplete="current-password">'+
    (msg?'<div class="err">'+esc(msg)+'</div>':'')+
    '<div style="margin-top:14px;display:flex;gap:8px"><button class="btn" id="lGo">Sign in</button>'+
    '<button class="btn q" id="lReset">Change database</button></div></div>';
  const go=async()=>{ $("#lGo").textContent="Signing in…";
    const {error}=await sb.auth.signInWithPassword({email:$("#lE").value.trim(),password:$("#lP").value});
    if(error) return login(error.message); boot(); };
  $("#lGo").onclick=go; $("#lP").onkeydown=e=>{ if(e.key==="Enter") go(); };
  $("#lReset").onclick=()=>{ localStorage.removeItem(CFG_KEY); setup(); };
}
async function boot(){
  const c=cfg(); if(!c) return setup();
  if(!sb) sb=window.supabase.createClient(c.url,c.key);
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return login();
  me=session.user;
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
  if(error) return login("Could not read your profile: "+error.message);
  if(!p) return login("This login has no profile row yet.");
  prof=p; await probe(); await loadAll();
  await turnRatesOn();
  watch();
  if(!week) week=isoOf(mondayOf(new Date()));
  if(!planWeek) planWeek=addDays(week,7);
  render();
}
async function probe(){
  const test=async (table,cols)=>{
    const r=await sb.from(table).select(cols).limit(1);
    return !r.error;
  };
  caps.costDue  = await test("costs","due_date");
  caps.prices   = await test("price_items","id");
  caps.measures = await test("measures","id");
}
async function loadAll(){
  const j=await sb.from("jobs").select("*").order("created_at");
  jobs=j.data||[];
  const want=localStorage.getItem(JOB_KEY);
  job=(want&&byId(jobs,want))||jobs[0]||null;
  if(job) localStorage.setItem(JOB_KEY,job.id);
  if(!job) return;
  const [t,c,f]=await Promise.all([
    sb.from("tasks").select("*").eq("job_id",job.id).order("start_date"),
    sb.from("task_comments").select("*").order("created_at"),
    sb.from("task_files").select("*").order("created_at")]);
  D.tasks=t.data||[]; D.comments=c.data||[]; D.files=f.data||[];
  if(admin()){
    const r=await Promise.all([
      sb.from("scope_items").select("*").eq("job_id",job.id).order("sort"),
      sb.from("movements").select("*").eq("job_id",job.id),
      sb.from("plan_items").select("*").eq("job_id",job.id),
      sb.from("costs").select("*").eq("job_id",job.id).order("cost_date",{ascending:false}),
      sb.from("crew").select("*"),
      sb.from("timesheets").select("*").eq("job_id",job.id),
      sb.from("claims").select("*").eq("job_id",job.id).order("created_at"),
      sb.from("claim_lines").select("*"),
      caps.measures ? sb.from("measures").select("*").eq("job_id",job.id).order("measured_on")
                    : Promise.resolve({data:[]})]);
    D.scope=r[0].data||[]; D.moves=r[1].data||[]; D.plans=r[2].data||[]; D.costs=r[3].data||[];
    D.crew=r[4].data||[]; D.sheets=r[5].data||[]; D.claims=r[6].data||[]; D.lines=r[7].data||[];
    D.measures=r[8].data||[];
    const q=await Promise.all([
      sb.from("clients").select("*").order("name"),
      sb.from("leads").select("*").order("created_at",{ascending:false}),
      sb.from("estimates").select("*").order("created_at",{ascending:false}),
      sb.from("estimate_sections").select("*").order("sort"),
      sb.from("estimate_items").select("*").order("sort"),
      sb.from("estimate_allowances").select("*").order("sort"),
      sb.from("orgs").select("*").limit(1),
      caps.prices ? sb.from("price_items").select("*").order("name")
                  : Promise.resolve({data:[]})]);
    D.clients=q[0].data||[]; D.leads=q[1].data||[]; D.ests=q[2].data||[];
    D.secs=q[3].data||[]; D.items=q[4].data||[]; D.allow=q[5].data||[];
    D.org=(q[6].data&&q[6].data[0])||null; D.prices=q[7].data||[];
  }else{
    const s=await sb.from("scope_public").select("*").eq("job_id",job.id).order("sort");
    D.scope=s.data||[];
  }
  lastSync=new Date();
}
function watch(){
  sb.channel("live")
   .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},async()=>{
      const t=await sb.from("tasks").select("*").eq("job_id",job.id).order("start_date");
      D.tasks=t.data||D.tasks; lastSync=new Date(); if(!busy&&!typing()) render(); })
   .on("postgres_changes",{event:"*",schema:"public",table:"task_comments"},async()=>{
      const c=await sb.from("task_comments").select("*").order("created_at");
      D.comments=c.data||D.comments; lastSync=new Date(); if(!busy&&!typing()) render(); })
   .subscribe();
}

/* Quotes made before the rate columns became the default still carry show_rates = false.
   Switch them on once, then never touch the setting again so a deliberate choice sticks. */
const RATES_FIX="mjgg:ratesfix";
async function turnRatesOn(){
  if(!admin()) return;
  if(localStorage.getItem(RATES_FIX)) return;
  const off=D.ests.filter(e=>e.show_rates!==true);
  if(off.length){
    const r=await sb.from("estimates").update({show_rates:true})
      .in("id",off.map(e=>e.id)).select();
    if(r.error){ console.warn("could not switch the rate columns on:",r.error.message); return; }
    D.ests=D.ests.map(e=>Object.assign({},e,{show_rates:true}));
  }
  localStorage.setItem(RATES_FIX,"done");
}

/* ---------------- money ---------------- */
function doneOf(id){
  const s=byId(D.scope,id); if(!s) return 0;
  let q=num(s.opening_qty);
  D.moves.forEach(m=>{ if(m.scope_item_id===id) q+=num(m.qty); });
  return Math.round(q*1000)/1000;
}
const sheetUnits=e=>Math.round([e.d0,e.d1,e.d2,e.d3,e.d4,e.d5,e.d6].reduce((a,b)=>a+num(b),0)*100)/100;
function sheetCost(e){
  if(e.override_amount!=null&&e.override_amount!=="") return num(e.override_amount);
  const c=byId(D.crew,e.crew_id); return c?sheetUnits(e)*num(c.rate):0;
}
const claimValue=c=>D.lines.filter(l=>l.claim_id===c.id).reduce((a,l)=>{
  const s=byId(D.scope,l.scope_item_id); return a+(s?num(l.qty)*num(s.rate):0);},0);
const claimDue=c=>(c.certified!=null&&num(c.certified))?num(c.certified):claimValue(c);
const claimOut=c=>Math.max(claimDue(c)-num(c.received),0);

function model(){
  let labour=0,subbie=0;
  D.sheets.forEach(e=>{ const c=byId(D.crew,e.crew_id);
    if(c&&c.category==="Subcontractor") subbie+=sheetCost(e); else labour+=sheetCost(e); });
  const supply=D.costs.reduce((a,c)=>a+num(c.amount),0);
  const actual=labour+subbie+supply;
  const contract=D.scope.filter(s=>s.kind==="Original Contract").reduce((a,s)=>a+num(s.qty)*num(s.rate),0);
  const measured=D.scope.filter(claimable).reduce((a,s)=>a+doneOf(s.id)*num(s.rate),0);
  const pcM=D.scope.filter(s=>s.kind==="PC Item").reduce((a,s)=>a+doneOf(s.id)*num(s.rate),0);
  const varAppr=D.scope.filter(s=>s.kind==="Variation"&&s.variation_status==="Approved").reduce((a,s)=>a+num(s.qty)*num(s.rate),0);
  const varPend=D.scope.filter(s=>s.kind==="Variation"&&s.variation_status==="Submitted").reduce((a,s)=>a+num(s.qty)*num(s.rate),0);
  const pendDone=D.scope.filter(s=>s.kind==="Variation"&&s.variation_status!=="Approved").reduce((a,s)=>a+doneOf(s.id)*num(s.rate),0);
  const value=contract+varAppr+pcM;
  const claimedBy={}; D.lines.forEach(l=>claimedBy[l.scope_item_id]=(claimedBy[l.scope_item_id]||0)+num(l.qty));
  const claimed=D.claims.reduce((a,c)=>a+claimValue(c),0);
  const received=D.claims.reduce((a,c)=>a+num(c.received),0);
  const owed=D.claims.filter(c=>c.status!=="Draft").reduce((a,c)=>a+claimOut(c),0);
  const ready=D.scope.filter(claimable).reduce((a,s)=>a+Math.max(doneOf(s.id)-(claimedBy[s.id]||0),0)*num(s.rate),0);
  const B={"Materials":"materials","Plant / Equipment":"plant","Subcontractor":"subbie",
    "Delivery / Freight":"other","Other":"other","Labour":"labour"};
  const byWeek={}; const touch=w=>byWeek[w]=byWeek[w]||{earned:0,labour:0,subbie:0,materials:0,plant:0,other:0};
  D.sheets.forEach(e=>{const c=byId(D.crew,e.crew_id);
    if(c&&c.category==="Subcontractor") touch(e.week_start).subbie+=sheetCost(e);
    else touch(e.week_start).labour+=sheetCost(e);});
  D.costs.forEach(c=>touch(c.week_start)[B[c.category]||"other"]+=num(c.amount));
  D.moves.forEach(m=>{const s=byId(D.scope,m.scope_item_id);
    if(s&&claimable(s)) touch(m.week_start).earned+=num(m.qty)*num(s.rate);});
  return {labour:labour,subbie:subbie,supply:supply,actual:actual,contract:contract,value:value,
    measured:measured,profit:measured-actual,margin:measured?(measured-actual)/measured:0,
    pendDone:pendDone,profitAll:(measured+pendDone)-actual,
    marginAll:(measured+pendDone)?((measured+pendDone)-actual)/(measured+pendDone):0,
    claimed:claimed,received:received,owed:owed,ready:ready,claimedBy:claimedBy,varPend:varPend,byWeek:byWeek};
}

function dayDiff(a,b){const p=a.split("-").map(Number),q=b.split("-").map(Number);
  return Math.round((new Date(q[0],q[1]-1,q[2])-new Date(p[0],p[1]-1,p[2]))/86400000);}
function monLab(mk,from,to){const p=mk.split("-").map(Number);
  return '<div class="gmon" style="left:'+(from*DW)+'px;width:'+((to-from)*DW)+'px">'+
    new Date(p[0],p[1]-1,1).toLocaleDateString("en-AU",{month:"long",year:"numeric"})+'</div>';}
function viewGantt(){
  const ts=D.tasks.slice().sort((a,b)=>a.start_date<b.start_date?-1:1);
  if(!ts.length) return '<div class="empty">No tasks yet.</div>';
  let first=ts[0].start_date,last=taskEnd(ts[0]);
  ts.forEach(t=>{ if(t.start_date<first) first=t.start_date; const e=taskEnd(t); if(e>last) last=e; });
  const today=isoOf(new Date());
  if(today<first) first=today; if(today>last) last=today;
  first=addDays(first,-3); last=addDays(last,7);
  const total=dayDiff(first,last)+1,W=total*DW;
  let cells="",months="",curM="",curStart=0;
  for(let i=0;i<total;i++){
    const d=addDays(first,i),p=d.split("-").map(Number),dt=new Date(p[0],p[1]-1,p[2]);
    const we=dt.getDay()===0||dt.getDay()===6;
    cells+='<div class="gday'+(we?" we":"")+'" style="left:'+(i*DW)+'px;width:'+DW+'px">'+
      '<div class="gdlab">'+String(p[2]).padStart(2,"0")+'</div></div>';
    const mk=p[0]+"-"+p[1];
    if(mk!==curM){ if(curM) months+=monLab(curM,curStart,i); curM=mk; curStart=i; }
  }
  months+=monLab(curM,curStart,total);
  const tx=dayDiff(first,today)*DW;
  let h='<div class="gwrap"><div style="min-width:'+(250+W)+'px">'+
    '<div class="grow ghead"><div class="gleft">Task</div>'+
    '<div class="gtrack" style="width:'+W+'px;height:38px">'+months+
    '<div style="position:absolute;top:17px;left:0;right:0;bottom:0">'+cells+'</div>'+
    (tx>=0&&tx<=W?'<div class="gtoday" style="left:'+tx+'px"></div>':'')+'</div></div>';
  ts.forEach((t,idx)=>{
    const off=dayDiff(first,t.start_date)*DW,w=Math.max(num(t.days),1)*DW-4;
    const sc=t.scope_item_id?byId(D.scope,t.scope_item_id):null;
    h+='<div class="grow"><div class="gleft">'+
      '<span class="dot" style="margin-top:0;background:'+(STATUS[t.status]||"#B9C0B6")+'"></span>'+
      '<span style="flex:1;min-width:0"><span class="gname">'+esc(t.name)+'</span>'+

      '<span style="position:absolute;left:0;top:0;bottom:0;width:'+num(t.pct)+'%;background:rgba(0,0,0,.22)"></span>'+
      '<span style="position:relative">'+esc(t.name)+'</span></div></div></div>';
  });

}

function darker(hex,amt){
  const h=String(hex||"#86C98B").replace("#","");
  const f=h.length===3?h.split("").map(c=>c+c).join(""):h;
  const n=parseInt(f,16); if(!isFinite(n)) return "#5E8A62";
  const k=amt==null?.42:amt;
  const r=Math.round(((n>>16)&255)*(1-k)),g=Math.round(((n>>8)&255)*(1-k)),b=Math.round((n&255)*(1-k));
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}
function jobSpan(){
  const ts=D.tasks.filter(t=>t.start_date);
  if(!ts.length){ const t0=isoOf(mondayOf(new Date())); return [t0,addDays(t0,27)]; }
  let a=ts[0].start_date,b=taskEnd(ts[0]);
  ts.forEach(t=>{ if(t.start_date<a) a=t.start_date; const e=taskEnd(t); if(e>b) b=e; });
  return [a,b];
}

/* build the column list for a range at a given scale */
function gpCols(from,to,scale){
  const n=dayDiff(from,to)+1,cols=[];
  if(scale==="day"){
    for(let i=0;i<n;i++){ const d=addDays(from,i),p=d.split("-").map(Number);
      const dt=new Date(p[0],p[1]-1,p[2]);
      cols.push({a:d,b:d,lab:String(p[2]).padStart(2,"0"),sub:DAYS[(dt.getDay()+6)%7][0],
        we:dt.getDay()===0||dt.getDay()===6,grp:p[0]+"-"+p[1],
        gl:dt.toLocaleDateString("en-AU",{month:"long",year:"numeric"})});
    }
  } else if(scale==="week"){
    let w=isoOf(mondayOf(new Date(from.split("-")[0],from.split("-")[1]-1,from.split("-")[2])));
    while(w<=to){ const e=addDays(w,6),p=w.split("-").map(Number);
      const dt=new Date(p[0],p[1]-1,p[2]);
      cols.push({a:w,b:e,lab:String(p[2]).padStart(2,"0")+"/"+String(p[1]).padStart(2,"0"),sub:"wk",
        we:false,grp:p[0]+"-"+p[1],
        gl:dt.toLocaleDateString("en-AU",{month:"long",year:"numeric"})});
      w=addDays(w,7); }
  } else {
    const p=from.split("-").map(Number); let y=p[0],mo=p[1]-1;
    while(isoOf(new Date(y,mo,1))<=to){
      const a=isoOf(new Date(y,mo,1)),b=isoOf(new Date(y,mo+1,0));
      cols.push({a:a,b:b,lab:new Date(y,mo,1).toLocaleDateString("en-AU",{month:"short"}),sub:"",
        we:false,grp:String(y),gl:String(y)});
      mo++; if(mo>11){mo=0;y++;} }
  }
  return cols;
}
function gpPickScale(from,to,orient,forced){
  const track=orient==="port"?142:214;                    // mm left for the timeline
  if(forced&&forced!=="auto") return forced;
  const days=dayDiff(from,to)+1;
  if(track/days>=3.9) return "day";
  const wk=gpCols(from,to,"week").length;
  if(track/wk>=8.4) return "week";
  return "month";
}
function viewGantPdf(){
  const o=D.org||{},g=gp;
  const from=g.from,to=g.to;
  const scale=gpPickScale(from,to,g.orient,g.scale);
  const cols=gpCols(from,to,scale);
  const nameW=g.orient==="port"?48:60;
  const track=(g.orient==="port"?190:277)-nameW;
  const colW=track/cols.length;
  const today=isoOf(new Date());

  /* which tasks show */
  let ts=D.tasks.filter(t=>t.start_date&&taskEnd(t)>=from&&t.start_date<=to);
  const outside=D.tasks.length-ts.length;
  if(g.hideDone) ts=ts.filter(t=>t.status!=="Done");
  if(g.area) ts=ts.filter(t=>{ const sc=t.scope_item_id?byId(D.scope,t.scope_item_id):null;
    return sc&&sc.area===g.area; });
  ts.sort((a,b)=>a.start_date<b.start_date?-1:a.start_date>b.start_date?1:
    (String(a.name||"")<String(b.name||"")?-1:1));

  /* group the rows */
  let groups;
  if(g.group){
    const m={};
    ts.forEach(t=>{ const sc=t.scope_item_id?byId(D.scope,t.scope_item_id):null;
      const k=(sc&&sc.area)?sc.area:"Other";
      (m[k]=m[k]||[]).push(t); });
    const order=AREAS.filter(a=>m[a]).concat(Object.keys(m).filter(k=>AREAS.indexOf(k)<0).sort());
    groups=order.map(k=>[k,m[k]]);
  } else groups=[[null,ts]];

  /* header rows: period bands + column labels */
  let band="",cur=null,curFrom=0;
  cols.forEach((c,i)=>{ if(c.grp!==cur){ if(cur!==null)
      band+='<th class="m1" colspan="'+(i-curFrom)+'">'+esc(cols[curFrom].gl)+'</th>';
      cur=c.grp; curFrom=i; } });
  band+='<th class="m1" colspan="'+(cols.length-curFrom)+'">'+esc(cols[curFrom].gl)+'</th>';
  const tdyIx=cols.findIndex(c=>today>=c.a&&today<=c.b);
  const tight=colW<4.6;
  const lab=cols.map((c,i)=>'<th class="h2'+(c.we?" we":"")+(i===tdyIx?" tdy":"")+(tight?" tight":"")+'">'+
    (c.sub&&c.sub!=="wk"?'<span class="wd">'+c.sub+'</span><b>'+c.lab+'</b>':"<b>"+c.lab+"</b>")+'</th>').join("");

  /* rows */
  let body="";
  groups.forEach(([gname,list])=>{
    if(gname) body+='<tr class="grp"><td class="gl">'+esc(gname)+'</td><td colspan="'+cols.length+'"></td></tr>';
    if(!list.length) return;
    list.forEach((t,idx)=>{
      const st=t.start_date,en=taskEnd(t);
      const sc=t.scope_item_id?byId(D.scope,t.scope_item_id):null;
      let a=cols.findIndex(c=>en>=c.a&&st<=c.b);
      let b=-1; cols.forEach((c,i)=>{ if(en>=c.a&&st<=c.b) b=i; });
      if(a<0){ a=0; b=-1; }
      const span=b>=a?b-a+1:0;
      const col=t.colour||PALETTE[idx%PALETTE.length];
      const dk=darker(col,.45);
      const pct=Math.max(0,Math.min(100,num(t.pct)));
      const late=t.status!=="Done"&&en<today;
      const clipL=st<from,clipR=en>to;
      const one=span===1&&num(t.days)===1&&scale==="day";
      let mid="";
      if(span>0){
        const wide=colW*span;
        const txt=(g.showPct!==false&&pct>0?pct+"%":"")||"";
        /* shade how far it has got, measured in real dates so a clipped bar stays honest */
        let shade=0;
        if(g.showPct!==false&&pct>0){
          const bs=cols[a].a>st?cols[a].a:st, be=cols[b].b<en?cols[b].b:en;
          const doneTo=addDays(st,Math.max(1,Math.round(pct/100*Math.max(num(t.days),1)))-1);
          if(doneTo>=bs){
            const end=doneTo<be?doneTo:be;
            shade=Math.min(100,(dayDiff(bs,end)+1)/(dayDiff(bs,be)+1)*100);
          }
        }
        const edge=late?"#A83A25":dk, ew=late?"1.4px":".9px";
        const inner=one
          ?'<div class="ms" style="background:'+col+';border:1.1px solid '+edge+'"></div>'
          :'<div class="bar" style="background:'+col+';border:'+ew+' solid '+edge+'">'+
            (shade>0?'<span class="pg" style="width:'+shade.toFixed(1)+'%;background:'+dk+'"></span>':'')+
            (clipL?'<span class="cont">◀</span>':'')+
            (txt&&wide>=11?'<span class="lb">'+txt+'</span>':'')+
            (clipR?'<span class="cont" style="margin-left:auto">▶</span>':'')+'</div>';
        mid='<td class="bc" colspan="'+span+'">'+inner+'</td>';
      }
      let cells="";
      for(let i=0;i<cols.length;i++){
        if(span>0&&i===a){ cells+=mid; i=b; continue; }
        cells+='<td class="c'+(cols[i].we?" we":"")+(i===tdyIx?" tdy":"")+'"></td>';
      }
      const meta=[fmtDay(st)+" – "+fmtDay(en),
        late?"LATE":"",
        num(t.days)+(num(t.days)===1?" day":" days"),
        (g.showWho!==false&&t.assignee)?esc(t.assignee):"",
        sc?esc(sc.code):""].filter(Boolean).join(" · ");
      body+='<tr><td class="nm"><div class="n">'+esc(t.name)+'</div>'+
        '<div class="s">'+meta+'</div></td>'+cells+'</tr>';
    });
  });
  if(!ts.length) body='<tr><td class="nm" colspan="'+(cols.length+1)+
    '" style="padding:18px 0;font-size:9pt;color:#777">No tasks fall inside these dates.</td></tr>';

  const mark=o.logo?'<img src="'+o.logo+'" alt="">':'';
  const used=Array.from(new Set(ts.map(t=>t.status)));
  const dn=ts.filter(t=>t.status==="Done").length;
  const avg=ts.length?Math.round(ts.reduce((s,t)=>s+num(t.pct),0)/ts.length):0;

  return '<div class="gpwrap '+(g.orient==="port"?"port":"land")+'"><div class="gphead">'+
    '<div><div class="lg">'+mark+'</div>'+
    (o.logo?'':'<div class="oname">'+esc(o.name||"")+'</div>')+
    '<div class="osub">'+(o.logo?esc(o.name||""):"")+(o.abn?(o.logo?' · ':'')+'ABN '+esc(o.abn):"")+
      (o.licence?'<br>QBCC '+esc(o.licence):"")+
      (o.phone?' · '+esc(o.phone):"")+'</div></div>'+
    '<div class="rt"><div class="ti">Construction Programme</div>'+
    '<div class="rg">'+esc(job?job.name:"")+'</div>'+
    (job&&job.ref?'<div class="as">'+esc(job.ref)+'</div>':"")+
    '<div class="as" style="margin-top:5px;color:#1D2420;font-weight:600">'+
      fmtDay(from)+' to '+longDate(to)+'</div>'+
    '<div class="as">Printed '+longDate(today)+
      ' · '+ts.length+' task'+(ts.length===1?"":"s")+
      (g.area?' · '+esc(g.area):"")+'</div></div></div>'+
    '<table class="gt"><colgroup><col style="width:'+nameW+'mm">'+
      cols.map(()=>'<col style="width:'+colW.toFixed(3)+'mm">').join("")+'</colgroup>'+
    '<thead><tr><th class="nh" rowspan="2"><div class="jb">'+esc(job?job.name:"")+
      ' · '+fmtDay(from)+' – '+fmtDay(to)+'</div>Task</th>'+band+'</tr><tr>'+lab+'</tr></thead>'+
    '<tbody>'+body+'</tbody></table>'+
    '<div class="gpleg">'+
      '<span class="k"><i style="background:'+PALETTE[0]+';border:.9px solid '+darker(PALETTE[0],.45)+'"></i>Task</span>'+
      (g.showPct!==false?'<span class="k"><i style="background:'+darker(PALETTE[0],.45)+'"></i>Done so far</span>':"")+
      '<span class="k"><i style="background:#fff;border:1.6px solid #A83A25"></i>Behind</span>'+
      '<span class="k"><i style="background:#F4F5F2;border:.5px solid #D9DDD5"></i>Weekend</span>'+
      (tdyIx>=0?'<span class="k"><i style="background:#fff;border-left:1.6px dashed #A83A25;border-radius:0;width:8px"></i>Today</span>':"")+
      '<span class="k">◀ ▶ runs on past these dates</span>'+
      '<span class="k" style="margin-left:auto;font-weight:600;color:#1D2420">'+
        dn+' of '+ts.length+' finished · '+avg+'% average</span>'+
    '</div>'+
    (outside||g.hideDone||g.area?'<div class="gpnote">'+
      [outside?outside+' task'+(outside===1?"":"s")+' fall outside these dates and are not shown.':"",
       g.hideDone?'Finished tasks have been left off.':"",
       g.area?'Only '+esc(g.area)+' is shown.':""].filter(Boolean).join(" ")+'</div>':"")+
    '<div class="gpfoot"><span>'+esc(o.name||"")+(o.licence?' · QBCC '+esc(o.licence):"")+'</span>'+
    '<span>'+esc(job?job.name:"")+' · programme '+fmtDay(from)+' – '+fmtDay(to)+'</span></div>'+
    '</div>';
}

let checkResult=null,checking=false;
async function runCheck(){
  checking=true; checkResult=[]; render();
  const org=prof.org_id;
  const j=(jobs[0]||{}).id, sc=(D.scope[0]||{}).id, cr=(D.crew[0]||{}).id;
  const est=(D.ests[0]||{}).id, sec=(D.secs[0]||{}).id, cm=(D.claims[0]||{}).id;
  const tests=[
    ["clients",       {org_id:org,name:"__check__"}],
    ["leads",         {org_id:org,title:"__check__",status:"New"}],
    ["jobs",          {org_id:org,name:"__check__",status:"Active"}],
    ["price_items",   {org_id:org,name:"__check__",cost:0}],
    ["estimates",     {org_id:org,number:"__check__",title:"__check__"}],
    ["estimate_sections", est?{estimate_id:est,name:"__check__",sort:999}:null],
    ["estimate_items",    sec?{section_id:sec,description:"__check__",qty:0,cost_each:0}:null],
    ["estimate_allowances", est?{estimate_id:est,description:"__check__",amount:0}:null],
    ["scope_items",   j?{org_id:org,job_id:j,code:"__check__",qty:0,rate:0}:null],
    ["crew",          {org_id:org,name:"__check__"}],
    ["costs",         j?{org_id:org,job_id:j,cost_date:isoOf(new Date()),
                         week_start:isoOf(mondayOf(new Date())),supplier:"__check__",amount:0}:null],
    ["claims",        j?{org_id:org,job_id:j,no:"__check__"}:null],
    ["claim_lines",   (cm&&sc)?{claim_id:cm,scope_item_id:sc,qty:0}:null],
    ["tasks",         j?{org_id:org,job_id:j,name:"__check__",start_date:isoOf(new Date())}:null],
    ["task_comments", (D.tasks[0]||{}).id?{org_id:org,task_id:D.tasks[0].id,body:"__check__"}:null],
    ["movements",     (j&&sc)?{org_id:org,job_id:j,scope_item_id:sc,
                         week_start:"1990-01-01",qty:0}:null],
    ["plan_items",    (j&&sc)?{org_id:org,job_id:j,scope_item_id:sc,
                         week_start:"1990-01-02",qty:0}:null],
  ];
  const out=[];
  for(const [table,row] of tests){
    if(!row){ out.push({table:table,ok:null,msg:"nothing to test against yet"}); continue; }
    const ins=await sb.from(table).insert(row).select().single();
    if(ins.error){ out.push({table:table,ok:false,msg:ins.error.message}); continue; }
    const del=await sb.from(table).delete().eq("id",ins.data.id);
    out.push({table:table,ok:!del.error,msg:del.error?("added but could not remove: "+del.error.message):"add and remove both fine"});
  }
  // the org row is updated, never inserted
  const o=await sb.from("orgs").update({name:(D.org||{}).name}).eq("id",org).select();
  out.push({table:"orgs",ok:!o.error&&(o.data||[]).length>0,
    msg:o.error?o.error.message:((o.data||[]).length?"can be updated":"update was refused")});
  checkResult=out; checking=false; render();
}

async function loadPortfolio(){
  const r=await Promise.all([
    sb.from("scope_items").select("job_id,kind,qty,rate,opening_qty,id,variation_status"),
    sb.from("movements").select("job_id,scope_item_id,qty"),
    sb.from("costs").select("job_id,amount"),
    sb.from("timesheets").select("job_id,crew_id,d0,d1,d2,d3,d4,d5,d6,override_amount"),
    sb.from("crew").select("id,rate,category")]);
  const sc=r[0].data||[],mv=r[1].data||[],co=r[2].data||[],ts=r[3].data||[],cw=r[4].data||[];
  const rateOf={}; cw.forEach(c=>rateOf[c.id]=c);
  const doneBy={}; sc.forEach(s=>doneBy[s.id]=num(s.opening_qty));
  mv.forEach(m=>{ if(doneBy[m.scope_item_id]!==undefined) doneBy[m.scope_item_id]+=num(m.qty); });
  const P={};
  const touch=id=>P[id]=P[id]||{contract:0,measured:0,cost:0};
  sc.forEach(s=>{ const p=touch(s.job_id);
    if(s.kind==="Original Contract") p.contract+=num(s.qty)*num(s.rate);
    if(s.kind!=="Variation"||s.variation_status==="Approved") p.measured+=doneBy[s.id]*num(s.rate); });
  co.forEach(c=>touch(c.job_id).cost+=num(c.amount));
  ts.forEach(e=>{ const c=rateOf[e.crew_id];
    const v=(e.override_amount!=null&&e.override_amount!=="")?num(e.override_amount)
      :(c?[e.d0,e.d1,e.d2,e.d3,e.d4,e.d5,e.d6].reduce((a,b)=>a+num(b),0)*num(c.rate):0);
    touch(e.job_id).cost+=v; });
  portfolio=P; render();
}

function daysTo(d){ if(!d) return null;
  const p=String(d).split("-").map(Number);
  return Math.round((new Date(p[0],p[1]-1,p[2]) - new Date().setHours(0,0,0,0))/86400000); }
function dueCell(c){
  if(c.status==="Paid") return '<span class="ps">paid</span>';
  if(!c.due_date) return '<span class="ps">–</span>';
  const n=daysTo(c.due_date);
  const cls = n<0 ? "neg" : n<=7 ? "neg" : "";
  const word = n<0 ? Math.abs(n)+"d overdue" : n===0 ? "today" : "in "+n+"d";
  return '<span class="'+cls+'" style="font-weight:'+(n<=7?600:400)+'">'+fmtDay(c.due_date)+
    '</span><div class="ps '+cls+'">'+word+'</div>';
}

/* ---------- Payables: every supplier, every job, by month ---------- */
let pay=null, payMonth=null;
function eom(d,plus){ const p=String(d).split("-").map(Number); return isoOf(new Date(p[0],p[1]+(plus||0),0)); }
function monthKey(d){ return String(d||"").slice(0,7); }
function addMonths(k,n){ const p=k.split("-").map(Number); return isoOf(new Date(p[0],p[1]-1+n,1)).slice(0,7); }
function monthName(k){ const p=k.split("-").map(Number);
  return new Date(p[0],p[1]-1,1).toLocaleDateString("en-AU",{month:"long",year:"numeric"}); }
function jobName(id){ const j=byId(jobs,id); return j?j.name:"—"; }
function owingOf(c){ return c.status==="Paid"?0:Math.max(0,num(c.amount)-num(c.paid)); }
async function loadPayables(){
  const r=await sb.from("costs").select("*").order("cost_date",{ascending:false});
  pay={costs:r.data||[]}; render();
}
async function payReload(){   // after a change on the Payables tab: refresh it and the open job's cost log
  await loadPayables();
  if(job) D.costs=pay.costs.filter(c=>c.job_id===job.id);
  render();
}
function viewPayables(){
  if(!pay) return '<div class="panel"><div class="empty">Working out what you owe…</div></div>';
  const today=isoOf(new Date()), thisM=monthKey(today), nextM=addMonths(thisM,1);
  if(!payMonth) payMonth=thisM;
  const open=pay.costs.filter(c=>owingOf(c)>0&&c.status!=="Internal / Accrued");
  const bucket=c=>{ if(!c.due_date) return "none"; if(c.due_date<today) return "late";
    const k=monthKey(c.due_date); return k===thisM?"this":k===nextM?"next":"later"; };
  const sum=a=>a.reduce((x,c)=>x+owingOf(c),0);
  const late=open.filter(c=>bucket(c)==="late"), due1=open.filter(c=>bucket(c)==="this"),
        due2=open.filter(c=>bucket(c)==="next"), none=open.filter(c=>bucket(c)==="none");
  const unc=open.filter(c=>c.status==="To Confirm"||c.status==="Awaiting Invoice");
  let h='<div class="band">'+
    cell("Overdue",money(sum(late)),late.length+" invoice"+(late.length===1?"":"s"),late.length?"neg":"")+
    cell("Due "+monthName(thisM),money(sum(due1)),due1.length+" invoice"+(due1.length===1?"":"s"))+
    cell("Due "+monthName(nextM),money(sum(due2)),due2.length+" invoice"+(due2.length===1?"":"s"))+
    cell("Total outstanding",money(sum(open)),"All suppliers, all jobs")+
    cell("Not confirmed",money(sum(unc)),unc.length+" to chase",unc.length?"neg":"")+
    '</div>';
  // by supplier
  const S={};
  open.forEach(c=>{ const k=(c.supplier||"—").trim(); const s=S[k]=S[k]||{late:0,this:0,next:0,later:0,none:0,n:0};
    s[bucket(c)]+=owingOf(c); s.n++; });
  const sups=Object.keys(S).sort((a,b)=>(S[b].late+S[b].this+S[b].next+S[b].later+S[b].none)-(S[a].late+S[a].this+S[a].next+S[a].later+S[a].none));
  h+='<div class="panel"><div class="ph"><div><div class="pt">By supplier</div><div class="ps">What is still owing, ex GST, across every job</div></div></div>'+
    '<div class="scroll"><table><thead><tr><th>Supplier</th><th class="r">Overdue</th><th class="r">'+monthName(thisM).split(" ")[0]+'</th>'+
    '<th class="r">'+monthName(nextM).split(" ")[0]+'</th><th class="r">Later</th><th class="r">No date</th><th class="r">Total</th><th class="r">Invoices</th></tr></thead><tbody>';
  const T={late:0,this:0,next:0,later:0,none:0,n:0};
  sups.forEach(k=>{ const s=S[k]; Object.keys(T).forEach(x=>T[x]+=s[x]);
    const tot=s.late+s.this+s.next+s.later+s.none;
    h+='<tr><td style="font-weight:600">'+esc(k)+'</td><td class="r'+(s.late?" neg":"")+'">'+(s.late?money(s.late,2):"–")+'</td>'+
      '<td class="r">'+(s.this?money(s.this,2):"–")+'</td><td class="r">'+(s.next?money(s.next,2):"–")+'</td>'+
      '<td class="r">'+(s.later?money(s.later,2):"–")+'</td><td class="r">'+(s.none?money(s.none,2):"–")+'</td>'+
      '<td class="r" style="font-weight:600">'+money(tot,2)+'</td><td class="r">'+s.n+'</td></tr>'; });
  h+='<tr class="tot"><td>Total</td><td class="r'+(T.late?" neg":"")+'">'+money(T.late,2)+'</td><td class="r">'+money(T.this,2)+'</td>'+
    '<td class="r">'+money(T.next,2)+'</td><td class="r">'+money(T.later,2)+'</td><td class="r">'+money(T.none,2)+'</td>'+
    '<td class="r">'+money(T.late+T.this+T.next+T.later+T.none,2)+'</td><td class="r">'+T.n+'</td></tr></tbody></table></div></div>';
  // invoices for the chosen month (plus anything overdue)
  const inMonth=open.filter(c=>c.due_date&&monthKey(c.due_date)===payMonth&&c.due_date>=today);
  const list=(payMonth===thisM?late:[]).concat(inMonth).sort((a,b)=>(a.due_date||"")<(b.due_date||"")?-1:1);
  const rowsFor=(arr,showDue)=>{
    let o=''; let last=null;
    arr.forEach(c=>{ const k=(c.supplier||"—").trim();
      if(k!==last){ const sub=arr.filter(x=>(x.supplier||"—").trim()===k);
        o+='<tr><td colspan="6" style="background:var(--paper);font-weight:600;padding-top:10px">'+esc(k)+
           ' <span class="ps" style="font-weight:400">· '+sub.length+' invoice'+(sub.length===1?"":"s")+'</span></td>'+
           '<td class="r" colspan="2" style="background:var(--paper);font-weight:600;padding-top:10px">'+money(sum(sub),2)+'</td>'+
           '<td style="background:var(--paper)"></td></tr>'; last=k; }
      o+='<tr><td style="white-space:nowrap">'+(showDue?dueCell(c):
          '<input class="in" type="date" style="width:140px;padding:4px 6px;font-size:12.5px" value="" data-act="pdue" data-id="'+c.id+'">')+'</td>'+
        '<td style="white-space:nowrap">'+esc(c.invoice_ref||"–")+'<div class="ps">'+fmtDay(c.cost_date)+'</div></td>'+
        '<td><span class="chip">'+esc(jobName(c.job_id))+'</span></td>'+
        '<td style="max-width:240px"><div class="clamp">'+esc(c.description)+'</div></td>'+
        '<td><select class="in" style="padding:4px 6px;font-size:12.5px" data-act="pstatus" data-id="'+c.id+'">'+
        PAYS.map(s=>'<option'+(c.status===s?" selected":"")+'>'+esc(s)+'</option>').join("")+'</select></td>'+
        '<td class="r">'+money(num(c.amount),2)+'</td>'+
        '<td class="r" style="font-weight:600">'+money(owingOf(c),2)+'</td>'+
        '<td style="white-space:nowrap"><button class="btn q sm" data-act="ppaid" data-id="'+c.id+'">Paid ✓</button></td>'+
        '<td><button class="x" data-act="payedit" data-id="'+c.id+'">✎</button></td></tr>'; });
    return o; };
  const head='<thead><tr><th>Due</th><th>Invoice</th><th>Job</th><th>What for</th><th>Status</th><th class="r">Amount</th><th class="r">Owing</th><th></th><th></th></tr></thead>';
  h+='<div class="panel"><div class="ph"><div><div class="pt">Invoices due '+monthName(payMonth)+
    (payMonth===thisM&&late.length?' <span class="neg" style="font-size:12px">+ '+late.length+' overdue</span>':'')+'</div>'+
    '<div class="ps">'+list.length+' invoice'+(list.length===1?"":"s")+' · '+money(sum(list),2)+' to pay</div></div>'+
    '<div style="display:flex;gap:6px"><button class="btn q sm" data-act="paymon" data-n="-1">◀</button>'+
    '<button class="btn q sm" data-act="paymon" data-n="0">This month</button>'+
    '<button class="btn q sm" data-act="paymon" data-n="1">▶</button></div></div><div class="scroll"><table>'+head+'<tbody>'+
    (list.length?rowsFor(list,true):'<tr><td colspan="9" class="empty">Nothing due in '+monthName(payMonth)+'.</td></tr>')+
    '</tbody></table></div></div>';
  if(none.length){
    h+='<div class="panel"><div class="ph"><div><div class="pt">No due date yet</div>'+
      '<div class="ps">'+none.length+' invoice'+(none.length===1?"":"s")+' · '+money(sum(none),2)+' · pick a date and it moves into the month above</div></div></div>'+
      '<div class="scroll"><table>'+head+'<tbody>'+rowsFor(none,false)+'</tbody></table></div></div>';
  }
  // by job
  const J={}; open.forEach(c=>{ J[c.job_id]=J[c.job_id]||{amt:0,n:0}; J[c.job_id].amt+=owingOf(c); J[c.job_id].n++; });
  h+='<div class="panel"><div class="ph"><div><div class="pt">By project</div><div class="ps">Where the outstanding bills sit</div></div></div>'+
    '<div class="scroll"><table><thead><tr><th>Job</th><th class="r">Outstanding</th><th class="r">Invoices</th></tr></thead><tbody>'+
    Object.keys(J).sort((a,b)=>J[b].amt-J[a].amt).map(id=>'<tr><td style="font-weight:600">'+esc(jobName(id))+'</td>'+
      '<td class="r">'+money(J[id].amt,2)+'</td><td class="r">'+J[id].n+'</td></tr>').join("")+
    '</tbody></table></div></div>'+
    '<div class="note"><div>Everything here is ex GST and comes from the cost log of every job. Marking an invoice paid here '+
    'marks it paid on that job too. Invoices without a due date assume end of the month after the invoice date when they are added.</div></div>';
  return h;
}

function viewClaims(m){
  const day=num(job.claim_day)||25,now=new Date(); now.setHours(0,0,0,0);
  let dd=new Date(now.getFullYear(),now.getMonth(),day); if(dd<now) dd.setMonth(dd.getMonth()+1);
  const dueIn=Math.round((dd-now)/86400000);
  const no="PC-"+String(D.claims.length+1).padStart(2,"0");
  if(claimTo===null) claimTo=isoOf(dd);
  const rows=D.scope.filter(claimable).map(s=>{
    const done=doneOf(s.id),already=m.claimedBy[s.id]||0;
    const sug=Math.max(Math.round((done-already)*1000)/1000,0);
    const qty=claimAdj[s.id]===undefined?sug:num(claimAdj[s.id]);
    return {s:s,done:done,already:already,sug:sug,qty:qty,value:qty*num(s.rate)};
  }).filter(r=>r.sug>0||r.qty>0);
  const total=rows.reduce((a,r)=>a+r.value,0);
  let h='<div class="band">'+
    cell("Claimed to date",money(m.claimed),D.claims.length+" claims")+
    cell("Received",money(m.received),"In the bank","pos")+
    cell("Owed to you",money(m.owed),"Raised but not paid",m.owed>0?"neg":"")+
    cell("Ready to claim",money(m.ready),no+" due "+dd.toLocaleDateString("en-AU",{day:"numeric",month:"short"}))+
    '</div><div class="panel"><div class="ph"><div><div class="pt">Claim '+no+' — ready to raise</div>'+
    '<div class="ps">Everything measured since your last claim'+(dueIn<=31?", due in "+dueIn+" days":"")+'</div></div>'+
    '<div style="display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap">'+
    '<div><span class="lab">Claim up to</span><input class="in" type="date" style="width:150px" value="'+claimTo+'" data-act="claimto"></div>'+
    '<div style="text-align:right"><div style="font-size:20px;font-weight:700">'+money(total,2)+'</div>'+
    '<div class="ps">'+rows.filter(r=>r.qty>0).length+' lines</div></div>'+
    '<button class="btn hi" data-act="raise"'+(total<=0?" disabled":"")+'>Raise '+no+'</button></div></div>';
  const risky=rows.filter(r=>{ const mv=measuredFor(r.s.id);
    return mv>0 && (r.already+r.qty) > mv+0.001; });
  if(risky.length) h+='<div class="note" style="border-color:#F0C4B8;background:#FDF1EE"><div>'+
    '<strong>'+risky.length+' line'+(risky.length===1?"":"s")+' would be claimed past what you have measured.</strong> '+
    risky.map(r=>esc(r.s.label||r.s.code)+" ("+(r.already+r.qty).toFixed(1)+" against "+
      measuredFor(r.s.id).toFixed(1)+" measured)").join(", ")+
    '. Check the Measure tab before you raise this claim.</div></div>';
  if(!rows.length) h+='<div class="empty">Nothing new to claim.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>ID</th><th style="min-width:200px">Scope</th>'+
      '<th class="r">Claimed before</th><th class="r">Measured now</th><th class="r">This claim</th>'+
      '<th class="r">Rate</th><th class="r">Value</th></tr></thead><tbody>';
    rows.forEach(r=>h+='<tr><td style="font-weight:600">'+esc(r.s.label||r.s.code)+'</td>'+
      '<td style="max-width:320px"><div class="clamp">'+esc(r.s.description)+'</div></td>'+
      '<td class="r">'+(r.already||"–")+'</td><td class="r">'+r.done+'</td>'+
      '<td class="r"><input class="in qty" inputmode="decimal" value="'+(claimAdj[r.s.id]===undefined?r.sug:esc(claimAdj[r.s.id]))+'" data-act="cadj" data-id="'+r.s.id+'"></td>'+
      '<td class="r">'+money(num(r.s.rate),2)+'</td><td class="r" style="font-weight:600">'+money(r.value,2)+'</td></tr>');
    h+='<tr class="tot"><td colspan="6">Claim total ex GST</td><td class="r">'+money(total,2)+'</td></tr></tbody></table></div>';
  }
  h+='</div><div class="panel"><div class="ph"><div class="pt">Claims raised</div>'+
    '<div class="ps">Update Received as the money lands</div></div>';
  if(!D.claims.length) h+='<div class="empty">No claims raised yet.</div>';
  else{
    h+='<div class="scroll"><table><thead><tr><th>Claim</th><th>Period</th><th class="r">Claimed</th>'+
      '<th class="r">Certified</th><th class="r">Received</th><th class="r">Outstanding</th><th>Status</th><th></th></tr></thead><tbody>';
    D.claims.forEach(c=>h+='<tr><td style="font-weight:600">'+esc(c.no)+'<div class="ps">'+
      D.lines.filter(l=>l.claim_id===c.id).length+' lines</div></td>'+
      '<td style="white-space:nowrap">'+(c.period_from?fmtDay(c.period_from)+" – ":"")+fmtDay(c.period_to)+'</td>'+
      '<td class="r" style="font-weight:600">'+money(claimValue(c),2)+'</td>'+
      '<td class="r"><input class="in qty" inputmode="decimal" placeholder="same" value="'+esc(c.certified==null?"":c.certified)+'" data-act="cert" data-id="'+c.id+'"></td>'+
      '<td class="r"><input class="in qty" inputmode="decimal" value="'+esc(c.received)+'" data-act="recd" data-id="'+c.id+'"></td>'+
      '<td class="r '+(claimOut(c)>0?"neg":"pos")+'" style="font-weight:600">'+money(claimOut(c),2)+'</td>'+
      '<td><select class="in" style="padding:4px 6px;font-size:12.5px" data-act="clstat" data-id="'+c.id+'">'+

      '<td class="r">'+money(m.received,2)+'</td><td class="r">'+money(m.owed,2)+'</td><td colspan="2"></td></tr></tbody></table></div>';
  }
  return h+'</div>';
}

/* ---------------- quotes ---------------- */
function estTotals(e){
  const secs=D.secs.filter(s=>s.estimate_id===e.id);
  let sell=0,cost=0;
  secs.forEach(s=>D.items.filter(i=>i.section_id===s.id).forEach(i=>{
    const r=num(i.cost_each)*(1+num(i.margin_pct)/100);
    sell+=num(i.qty)*r; cost+=num(i.qty)*num(i.cost_each);
  }));
  const allow=D.allow.filter(a=>a.estimate_id===e.id).reduce((a,x)=>a+num(x.amount),0);
  const sub=sell+allow, gst=sub*num(e.gst_rate||0.1);
  return {sell:sell,cost:cost,allow:allow,sub:sub,gst:gst,total:sub+gst,
    margin:sell?(sell-cost)/sell:0,profit:sell-cost};
}

    '<div class="bar"></div><div class="shot">'+(back?'<img src="'+esc(back)+'" alt="">':"")+'</div></div>';

function nextQuoteNo(){
  let n=num((D.org&&D.org.quote_seq)||1774);
  D.ests.forEach(e=>{ const m=String(e.number||"").match(/(\d+)/);
    if(m&&num(m[1])>n) n=num(m[1]); });
  return "Q"+(n+1);
}

const TBL={cl:"clients",ld:"leads",es:"estimates",it:"estimate_items",al:"estimate_allowances",
  sec:"estimate_sections",jb2:"jobs",pi:"price_items",me:"measures"};
const ARR={cl:"clients",ld:"leads",es:"ests",it:"items",al:"allow",sec:"secs",pi:"prices",me:"measures"};
function setLocal(a,id,f,v){
  const key=ARR[a]; if(!key||!D[key]) return;
  D[key]=D[key].map(x=>{ if(x.id!==id) return x; const y=Object.assign({},x); y[f]=v; return y; });
}
const NUMF={est_value:1,qty:1,cost_each:1,margin_pct:1,amount:1,valid_days:1,cost:1,
  default_margin:1,terms_cols:1};
const NULLABLE={scope_item_id:1};
const BOOLF={show_rates:1};
const LONGF={terms:1,spec:1,letter:1,contact_note:1,items_intro:1,summary_intro:1,notes:1};
async function saveField(a,el){
  const id=el.getAttribute("data-id"),f=a==="sec"?"name":el.getAttribute("data-f");
  let v=el.value;
  // a long text field going from full to empty is almost always a glitch, not a decision
  if(LONGF[f]&&v===""){
    const key=ARR[a], was=key&&D[key]?(byId(D[key],id)||{})[f]:null;
    if(was&&String(was).length>40&&
       !confirm("This will erase "+String(was).length+" characters from that field.\n\nAre you sure?"))
      { render(); return; }
  }
  if(NUMF[f]) v=num(v);
  else if(BOOLF[f]) v=(v==="true");
  else if(v==="") v=null;
  if(NULLABLE[f]&&v==="") v=null;
  const patch={}; patch[f]=v;
  if(await db(sb.from(TBL[a]).update(patch).eq("id",id))){
    setLocal(a,id,f,v);          // update in place rather than reloading the screen
    if(!typing()) render();
  }
}

async function db(p,label){
  const {data,error}=await (typeof p.select==="function" ? p.select() : p);
  if(error){ alert((label||"Could not save")+": "+error.message); return false; }
  if(Array.isArray(data)&&data.length===0){
    alert((label||"Nothing was saved")+".\n\nThe database refused the change, which usually means "+
      "a permission rule is missing for that table. Tell me which screen you were on.");
    return false;
  }
  return true;
}
document.addEventListener("click",async ev=>{

    const p=num(el.getAttribute("data-p")),t=byId(D.tasks,id);
    const st=p===100?"Done":(p>0&&t.status==="Not started"?"On the go":t.status);
    D.tasks=D.tasks.map(x=>x.id===id?Object.assign({},x,{pct:p,status:st}):x); render();

      author:prof.full_name||me.email,body:body.trim()}))){

  if(a==="pick"||a==="planpick"){ pickMode=(a==="planpick")?"plan":"week"; openModal(pickerHtml("")); return; }
  if(a==="pickone"){

      crew_id:c.id,week_start:week,area:c.area}));
