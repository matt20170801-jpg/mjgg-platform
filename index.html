  if(a==="estprint"){ printing=true; render(); return; }
  if(a==="unprint"){ printing=false; render(); return; }
  if(a==="doprint"){ window.print(); return; }
  if(a==="secadd"){
    const n=D.secs.filter(s=>s.estimate_id===estId).length;
    if(await db(sb.from("estimate_sections").insert({estimate_id:estId,name:"New section",sort:n}))) await refresh(); return; }
  if(a==="secdel"){ if(!confirm("Delete this section and its lines?")) return;
    if(await db(sb.from("estimate_sections").delete().eq("id",id))) await refresh(); return; }
  if(a==="copyfix"){
    const k=el.getAttribute("data-k"), ta=document.createElement("textarea");
    ta.value=FIXES[k].sql; ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); alert("Copied. Paste it into Supabase, SQL Editor, and press Run."); }
    catch(e){ alert("Could not copy. Select the text in the box and copy it by hand."); }
    document.body.removeChild(ta); return; }
  if(a==="runcheck"){ await runCheck(); return; }
  if(a==="measadd"){
    if(await db(sb.from("measures").insert({org_id:prof.org_id,job_id:job.id,
      measured_on:isoOf(new Date()),source:"Site count",qty:0}))) await refresh(); return; }
  if(a==="medel"){ if(!confirm("Delete this measurement?")) return;
    if(await db(sb.from("measures").delete().eq("id",id))) await refresh(); return; }
  if(a==="meverify"){ const x=byId(D.measures,id);
    if(await db(sb.from("measures").update({verified:!x.verified}).eq("id",id))) await refresh(); return; }
  if(a==="usemeas"){
    const s=byId(D.scope,id), meas=measuredFor(id), rec=doneOf(id);
    const gap=Math.round((meas-rec)*1000)/1000;
    if(!confirm("Set "+(s.label||s.code)+" to the measured quantity?\n\nRecorded "+rec+
      ", measured "+meas+".\nThis adds "+(gap>0?"+":"")+gap+" against the week of "+fmtDay(week)+".")) return;
    const ex=D.moves.filter(mv=>mv.scope_item_id===id&&mv.week_start===week)[0];
    const ok = ex
      ? await db(sb.from("movements").update({qty:num(ex.qty)+gap}).eq("id",ex.id))
      : await db(sb.from("movements").insert({org_id:prof.org_id,job_id:job.id,
          scope_item_id:id,week_start:week,qty:gap,created_by:me.id}));
    if(ok) await refresh(); return; }
  if(a==="priceadd"){
    if(await db(sb.from("price_items").insert({org_id:prof.org_id,name:"New item",unit:"m2",
      cost:0,margin_pct:num((D.org||{}).default_margin)||20}))) await refresh(); return; }
  if(a==="pidel"){ if(!confirm("Delete this price list item? Quotes already using it keep their own copy.")) return;
    if(await db(sb.from("price_items").delete().eq("id",id))) await refresh(); return; }
  if(a==="ppick"){ pickSection=id; openModal(pricePicker("")); return; }
  if(a==="ppone"){
    const x=byId(D.prices,id), s=pickSection;
    closeModal();
    const n=D.items.filter(i=>i.section_id===s).length;
    if(await db(sb.from("estimate_items").insert({section_id:s,description:x.name,unit:x.unit,
      qty:1,cost_each:num(x.cost),margin_pct:num(x.margin_pct),price_item_id:x.id,sort:n}))){
      await sb.from("price_items").update({used_count:num(x.used_count)+1}).eq("id",x.id);
      await refresh(); }
    return; }
  if(a==="estdup"){
    const e=byId(D.ests,id);
    if(!confirm("Make a copy of "+e.no+" as a new draft?".replace("undefined",e.number))) return;
    const {data:ne,error}=await sb.from("estimates").insert({org_id:prof.org_id,client_id:e.client_id,
      number:nextQuoteNo(),title:(e.title||"")+" (copy)",site_address:e.site_address,
      issue_date:isoOf(new Date()),valid_days:e.valid_days,letter:e.letter,spec:e.spec,terms:e.terms,
      contact_note:e.contact_note,items_intro:e.items_intro,summary_intro:e.summary_intro,
      show_rates:e.show_rates,default_margin:e.default_margin,status:"Draft"}).select().single();
    if(error) return alert("Could not copy: "+error.message);
    for(const s of D.secs.filter(x=>x.estimate_id===id)){
      const {data:ns}=await sb.from("estimate_sections").insert({estimate_id:ne.id,name:s.name,sort:s.sort}).select().single();
      const rows=D.items.filter(i=>i.section_id===s.id).map(i=>({section_id:ns.id,description:i.description,
        unit:i.unit,qty:i.qty,cost_each:i.cost_each,margin_pct:i.margin_pct,price_item_id:i.price_item_id,sort:i.sort}));
      if(rows.length) await sb.from("estimate_items").insert(rows);
    }
    const alw=D.allow.filter(x=>x.estimate_id===id).map(a2=>({estimate_id:ne.id,description:a2.description,
      amount:a2.amount,sort:a2.sort}));
    if(alw.length) await sb.from("estimate_allowances").insert(alw);
    estId=ne.id; await refresh(); return; }
  if(a==="est2job"){
    const e=byId(D.ests,id), T=estTotals(e);
    const cl=byId(D.clients,e.client_id);
    if(!confirm("Create a job from "+e.number+"?\n\nEvery quoted line becomes a scope line at the price "+
      "the client sees, so you can measure and claim against it. The quote itself is not changed.")) return;
    const {data:nj,error}=await sb.from("jobs").insert({org_id:prof.org_id,client_id:e.client_id,
      name:e.title||e.number,ref:e.number,status:"Active",claim_day:25}).select().single();
    if(error) return alert("Could not create the job: "+error.message);
    const rows=[]; let n=0;
    D.secs.filter(s=>s.estimate_id===id).forEach(s=>{
      D.items.filter(i=>i.section_id===s.id).forEach(i=>{
        const sell=num(i.cost_each)*(1+num(i.margin_pct)/100);
        rows.push({org_id:prof.org_id,job_id:nj.id,code:(s.name||"").slice(0,12).toUpperCase().replace(/\s+/g,"-")+"-"+(n+1),
          label:(i.description||"").slice(0,40),area:s.name,kind:"Original Contract",
          description:i.description,unit:i.unit,qty:num(i.qty),rate:sell,opening_qty:0,sort:n});
        n++; }); });
    D.allow.filter(x=>x.estimate_id===id).forEach(a2=>{
      rows.push({org_id:prof.org_id,job_id:nj.id,code:"PC-"+(n+1),label:(a2.description||"").slice(0,40),
        area:"Allowances",kind:"PC Item",description:a2.description,unit:"item",qty:1,
        rate:num(a2.amount),opening_qty:0,sort:n}); n++; });
    if(rows.length){ const r=await sb.from("scope_items").insert(rows);
      if(r.error) return alert("Job made but the scope did not load: "+r.error.message); }
    await sb.from("estimates").update({job_id:nj.id,status:"Accepted",decided_at:isoOf(new Date())}).eq("id",id);
    if(e.lead_id) await sb.from("leads").update({status:"Won"}).eq("id",e.lead_id);
    localStorage.setItem(JOB_KEY,nj.id); portfolio=null; estId=null; tab="progress";
    await refresh();
    alert("Job created with "+rows.length+" scope lines, worth "+money(T.sub,2)+" ex GST.");
    return; }
  if(a==="itemadd"){
    const n=D.items.filter(i=>i.section_id===id).length;
    const e0=byId(D.ests,estId)||{};
    if(await db(sb.from("estimate_items").insert({section_id:id,description:"",unit:"m2",qty:0,
      cost_each:0,margin_pct:num(e0.default_margin)||20,sort:n}))) await refresh(); return; }
  if(a==="itemdel"){ if(await db(sb.from("estimate_items").delete().eq("id",id))) await refresh(); return; }
  if(a==="alwadd"){
    const n=D.allow.filter(x=>x.estimate_id===estId).length;
    if(await db(sb.from("estimate_allowances").insert({estimate_id:estId,description:"",amount:0,sort:n}))) await refresh(); return; }
  if(a==="alwdel"){ if(await db(sb.from("estimate_allowances").delete().eq("id",id))) await refresh(); return; }
  if(a==="costadd"){ openModal(costForm(null)); return; }
  if(a==="costedit"){ openModal(costForm(byId(D.costs,id))); return; }
  if(a==="payedit"){ openModal(costForm(byId(pay.costs,id))); return; }
  if(a==="paymon"){ const n=num(el.getAttribute("data-n"));
    payMonth=n===0?monthKey(isoOf(new Date())):addMonths(payMonth,n); render(); return; }
  if(a==="ppaid"){ const c=byId(pay.costs,id); if(!c) return;
    if(!confirm("Mark "+c.supplier+" "+(c.invoice_ref||"")+" ("+money(num(c.amount),2)+") as paid in full?")) return;
    if(await db(sb.from("costs").update({status:"Paid",paid:num(c.amount)}).eq("id",id))) await payReload(); return; }
  if(a==="costdel"){ if(!confirm("Delete this cost?")) return;
    if(await db(sb.from("costs").delete().eq("id",id))) await refresh(); return; }
  if(a==="costsave"){
    const g=x=>document.getElementById("f_"+x).value;
    if(!g("supplier").trim()||!num(g("amount"))) return alert("A supplier and an amount are needed.");
    const rec={cost_date:g("date"),week_start:isoOf(mondayOf(g("date"))),
      area:g("area"),category:g("category"),supplier:g("supplier"),description:g("desc"),
      invoice_ref:g("ref"),amount:num(g("amount")),status:g("status"),paid:num(g("paid"))};
    if(!id) rec.job_id=job.id;   // an edit keeps the job it belongs to, whichever tab it was opened from
    if(caps.costDue){
      const t=g("terms");
      rec.terms_days=/^\d+$/.test(t)?num(t):null;
      rec.due_date=g("due")||(t==="eom"?eom(g("date"),0):t==="eonm"?eom(g("date"),1):
                   /^\d+$/.test(t)?addDays(g("date"),num(t)):null);
    }
    closeModal();
    if(await db(id?sb.from("costs").update(rec).eq("id",id)
                  :sb.from("costs").insert(Object.assign({org_id:prof.org_id},rec)))) await refresh();
    return; }
  if(a==="crewadd"){
    if(await db(sb.from("crew").insert({org_id:prof.org_id,name:"New person",basis:"Daily",
      rate:0,category:"Labour",area:AREAS[1],active:true}))) await refresh(); return; }
  if(a==="cwactive"){ const c=byId(D.crew,id);
    if(await db(sb.from("crew").update({active:!c.active}).eq("id",id))) await refresh(); return; }
  if(a==="cwdel"){ if(!confirm("Remove this person? Their recorded weeks stay.")) return;
    if(await db(sb.from("crew").delete().eq("id",id))) await refresh(); return; }
  if(a==="cldel"){ const c=byId(D.claims,id);
    if(!confirm("Delete claim "+c.no+"? Its quantities go back into what is ready to claim.")) return;
    if(await db(sb.from("claims").delete().eq("id",id))) await refresh(); return; }
  if(a==="raise"){
    const m=model(),lines=[];
    D.scope.filter(claimable).forEach(s=>{
      const already=m.claimedBy[s.id]||0,sug=Math.max(doneOf(s.id)-already,0);
      const qty=claimAdj[s.id]===undefined?sug:num(claimAdj[s.id]);
      if(qty>0) lines.push({scope_item_id:s.id,qty:qty}); });
    if(!lines.length) return;
    let lastTo=""; D.claims.forEach(c=>{ if(c.period_to>lastTo) lastTo=c.period_to; });
    const {data,error}=await sb.from("claims").insert({org_id:prof.org_id,job_id:job.id,
      no:"PC-"+String(D.claims.length+1).padStart(2,"0"),
      period_from:lastTo?addDays(lastTo,1):null,period_to:claimTo,status:"Draft"}).select().single();
    if(error) return alert("Could not raise the claim: "+error.message);
    if(await db(sb.from("claim_lines").insert(lines.map(l=>Object.assign({claim_id:data.id},l))))){
      claimAdj={}; await refresh(); }
    return; }
});

document.addEventListener("change",async ev=>{
  const el=ev.target,a=el.getAttribute&&el.getAttribute("data-act"); if(!a) return;
  const id=el.getAttribute("data-id"),v=el.value;
  if(a==="wkset"){ week=isoOf(mondayOf(v)); render(); return; }
  if(a==="st"){
    const patch=v==="Done"?{status:v,pct:100}:{status:v};
    D.tasks=D.tasks.map(x=>x.id===id?Object.assign({},x,patch):x); render();
    await db(sb.from("tasks").update(Object.assign({updated_by:me.id},patch)).eq("id",id)); return; }
  if(a==="cstatus"){ if(await db(sb.from("costs").update({status:v}).eq("id",id))) await refresh(); return; }
  if(a==="pstatus"){ const c=byId(pay.costs,id)||{};
    const patch=v==="Paid"?{status:v,paid:num(c.amount)}:{status:v};
    if(await db(sb.from("costs").update(patch).eq("id",id))) await payReload(); return; }
  if(a==="pdue"){ if(!v) return;
    if(await db(sb.from("costs").update({due_date:v}).eq("id",id))) await payReload(); return; }
  if(a==="clstat"){ if(await db(sb.from("claims").update({status:v}).eq("id",id))) await refresh(); return; }
  if(a==="cw"){ const f=el.getAttribute("data-f"),val=(f==="rate")?num(v):v;
    const patch={}; patch[f]=val;
    if(await db(sb.from("crew").update(patch).eq("id",id))) await refresh(); return; }
  if(a==="costcat"){ costCat=v; render(); return; }
  if(a==="leadfilter"){ leadFilter=v; render(); return; }
  if(a==="jobpick"){ localStorage.setItem(JOB_KEY,v); portfolio=null; estId=null; await refresh(); return; }
  if(a==="jb"){ const f=el.getAttribute("data-f");
    const patch={}; patch[f]=(f==="client_id"&&v==="")?null:v;
    if(await db(sb.from("jobs").update(patch).eq("id",id))){ portfolio=null; await refresh(); } return; }
  if(a==="eststat"){ if(await db(sb.from("estimates").update({status:v}).eq("id",id))) await refresh(); return; }
  if(a==="measfilter"){ measScope=v; render(); return; }
  if(a==="cl"||a==="ld"||a==="es"||a==="it"||a==="al"||a==="sec"||a==="jb2"||a==="pi"||a==="me"){
    await saveField(a,el); return; }
  if(a==="claimto"){ claimTo=v; render(); return; }
  if(a==="og"){ const f=el.getAttribute("data-f");
    if((f==="default_terms"||f==="default_spec")&&v===""){
      const was=(D.org||{})[f];
      if(was&&String(was).length>40&&!confirm("This will erase "+String(was).length+
        " characters of your standard wording.\n\nAre you sure?")){ render(); return; } }
    const patch={}; patch[f]=(f==="quote_seq"||f==="terms_cols")?num(v):v;
    if(await db(sb.from("orgs").update(patch).eq("id",prof.org_id))) await refresh(); return; }
  if(a==="shotdel"){ const f=el.getAttribute("data-f");
    if(!confirm("Remove this photo?")) return;
    const patch={}; patch[f]=null;
    if(await db(sb.from("orgs").update(patch).eq("id",prof.org_id))) await refresh(); return; }
  if(a==="shotup"&&el.files&&el.files[0]){
    const f=el.getAttribute("data-f"),rd=new FileReader(),img=new Image();
    rd.onload=()=>{ img.onload=async()=>{
      const W=1400,sc=Math.min(W/img.width,1);
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      const url=cv.toDataURL("image/jpeg",0.72);
      if(url.length>1800000) return alert("That photo is too big even after resizing. Try another.");
      const patch={}; patch[f]=url;
      if(await db(sb.from("orgs").update(patch).eq("id",prof.org_id))) await refresh();
    }; img.src=rd.result; };
    rd.readAsDataURL(el.files[0]); return; }
  if(a==="logoup"&&el.files&&el.files[0]){
    const rd=new FileReader(),img=new Image();
    rd.onload=()=>{ img.onload=async()=>{
      // trim the blank margin so it sits tight on the letterhead
      const c0=document.createElement("canvas");
      c0.width=img.width; c0.height=img.height;
      const x0=c0.getContext("2d"); x0.drawImage(img,0,0);
      let L=img.width,R=0,T=img.height,B=0;
      try{
        const px=x0.getImageData(0,0,img.width,img.height).data;
        for(let y=0;y<img.height;y++) for(let x=0;x<img.width;x++){
          const i=(y*img.width+x)*4, a=px[i+3];
          const light=px[i]>245&&px[i+1]>245&&px[i+2]>245;
          if(a>12&&!light){ if(x<L)L=x; if(x>R)R=x; if(y<T)T=y; if(y>B)B=y; } }
      }catch(err){ L=0;R=img.width-1;T=0;B=img.height-1; }
      if(R<L||B<T){ L=0;R=img.width-1;T=0;B=img.height-1; }
      const w0=R-L+1,h0=B-T+1,W=Math.min(560,w0),sc=W/w0;
      const cv=document.createElement("canvas");
      cv.width=Math.round(w0*sc); cv.height=Math.round(h0*sc);
      cv.getContext("2d").drawImage(img,L,T,w0,h0,0,0,cv.width,cv.height);
      const url=cv.toDataURL("image/png");
      if(url.length>900000) return alert("That image is too big. Try a smaller or simpler file.");
      if(await db(sb.from("orgs").update({logo:url}).eq("id",prof.org_id))) await refresh();
    }; img.src=rd.result; };
    rd.readAsDataURL(el.files[0]); return; }
  if(a==="photo"&&el.files&&el.files[0]){
    busy=true;
    const rd=new FileReader(),img=new Image();
    rd.onload=()=>{ img.onload=async()=>{
      const max=1200,sc=Math.min(max/img.width,max/img.height,1);
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(async b=>{
        const path=prof.org_id+"/"+id+"/"+Date.now()+".jpg";
        const up=await sb.storage.from("site-files").upload(path,b,{contentType:"image/jpeg"});
        if(up.error){ busy=false; return alert("Upload failed: "+up.error.message); }
        await db(sb.from("task_files").insert({org_id:prof.org_id,task_id:id,job_id:job.id,
          path:path,kind:"photo",uploaded_by:me.id}));
        const fl=await sb.from("task_files").select("*").order("created_at");
        D.files=fl.data||D.files; busy=false; render();
      },"image/jpeg",0.72); }; img.src=rd.result; };
    rd.readAsDataURL(el.files[0]);
  }
});

document.addEventListener("input",ev=>{
  const el=ev.target,a=el.getAttribute&&el.getAttribute("data-act"); if(!a) return;
  const id=el.getAttribute("data-id"),v=el.value;
  if(a==="mvq") D.moves=D.moves.map(x=>x.id===id?Object.assign({},x,{qty:v}):x);
  else if(a==="plq") D.plans=D.plans.map(x=>x.id===id?Object.assign({},x,{qty:v}):x);
  else if(a==="day"){ const f="d"+el.getAttribute("data-i");
    D.sheets=D.sheets.map(x=>{ if(x.id!==id) return x; const y=Object.assign({},x); y[f]=v; return y; }); }
  else if(a==="ovr") D.sheets=D.sheets.map(x=>x.id===id?Object.assign({},x,{override_amount:v}):x);
  else if(a==="open") D.scope=D.scope.map(x=>x.id===id?Object.assign({},x,{opening_qty:v}):x);
  else if(a==="cert") D.claims=D.claims.map(x=>x.id===id?Object.assign({},x,{certified:v}):x);
  else if(a==="recd") D.claims=D.claims.map(x=>x.id===id?Object.assign({},x,{received:v}):x);
  else if(a==="cadj") claimAdj[id]=v;
  else if(a==="cl"||a==="ld"||a==="es"||a==="it"||a==="al"||a==="sec"||a==="pi"||a==="me"){
    setLocal(a,id,a==="sec"?"name":el.getAttribute("data-f"),v); }
  else if(a==="jb"){ const f2=el.getAttribute("data-f");
    jobs=jobs.map(x=>{ if(x.id!==id) return x; const y=Object.assign({},x); y[f2]=v; return y; }); }
  else if(a==="priceq") priceQ=v;
  else if(a==="ppq"){ const pos=el.selectionStart; $("#sheet").innerHTML=pricePicker(v);
    const nb=document.getElementById("pickQ"); nb.focus(); nb.setSelectionRange(pos,pos); }
  else if(a==="pgq") pgQ=v;
  else if(a==="costq") costQ=v;
  else if(a==="pickq"){ const pos=el.selectionStart;
    $("#sheet").innerHTML=pickerHtml(v);
    const nb=document.getElementById("pickQ"); nb.focus(); nb.setSelectionRange(pos,pos); }
});

document.addEventListener("blur",async ev=>{
  const el=ev.target,a=el.getAttribute&&el.getAttribute("data-act"); if(!a) return;
  const id=el.getAttribute("data-id"),v=el.value;
  if(a==="mvq"){ if(await db(sb.from("movements").update({qty:num(v)}).eq("id",id))) render(); }
  else if(a==="plq"){ if(await db(sb.from("plan_items").update({qty:num(v)}).eq("id",id))) render(); }
  else if(a==="day"){ const f="d"+el.getAttribute("data-i"),patch={};
    patch[f]=(v==="")?null:num(v);
    if(await db(sb.from("timesheets").update(patch).eq("id",id))) render(); }
  else if(a==="ovr"){ if(await db(sb.from("timesheets").update({override_amount:(v===""?null:num(v))}).eq("id",id))) render(); }
  else if(a==="open"){ if(await db(sb.from("scope_items").update({opening_qty:num(v)}).eq("id",id))) render(); }
  else if(a==="cert"){ if(await db(sb.from("claims").update({certified:(v===""?null:num(v))}).eq("id",id))) render(); }
  else if(a==="recd"){ if(await db(sb.from("claims").update({received:num(v)}).eq("id",id))) render(); }
  else if(a==="cl"||a==="ld"||a==="es"||a==="it"||a==="al"||a==="sec"||a==="pi"||a==="me"){ await saveField(a,el); }
  else if(a==="priceq") render();
  else if(a==="jb"){ const f=el.getAttribute("data-f"),patch={}; patch[f]=el.value;
    if(await db(sb.from("jobs").update(patch).eq("id",el.getAttribute("data-id")))) portfolio=null; }
  if(pendingRender){ pendingRender=false; setTimeout(render,0); }
  else if(a==="pgq"||a==="costq"||a==="cadj") render();
},true);

boot();
</script>
